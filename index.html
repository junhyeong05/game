<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d1c">
  <title>미니 슈팅</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="ready">
  <main class="app">
    <header class="topbar">
      <h1 class="logo">🚀 미니 슈팅</h1>
      <div class="top-buttons">
        <button type="button" id="sound-btn" class="icon-btn" title="소리 켜기/끄기 (M)">🔊</button>
        <button type="button" id="pause-btn" class="icon-btn" title="일시정지 (P)">⏸</button>
      </div>
    </header>

    <section class="hud">
      <div class="stat"><span class="label">점수</span><b id="score">0</b></div>
      <div class="stat"><span class="label">레벨</span><b id="level">1</b></div>
      <div class="stat"><span class="label">최고</span><b id="best">0</b></div>
      <div class="stat"><span class="label">목숨</span><b id="lives" class="hearts">❤️❤️❤️</b></div>
    </section>

    <div class="stage">
      <canvas id="game" width="540" height="720" aria-label="미니 슈팅 게임 화면"></canvas>

      <!-- 시작 화면 -->
      <div id="start-screen" class="overlay">
        <h2>미니 슈팅</h2>
        <p>떨어지는 적을 맞혀 점수를 얻으세요.<br>적과 부딪히거나 적이 바닥에 닿으면 목숨이 줄어요.</p>
        <ul class="howto howto-keys">
          <li><kbd>←</kbd> <kbd>→</kbd> 또는 <kbd>A</kbd> <kbd>D</kbd> 이동</li>
          <li><kbd>Space</kbd> 발사</li>
          <li><kbd>P</kbd> 일시정지 · <kbd>M</kbd> 소리</li>
        </ul>
        <p class="howto howto-touch">화면 아래 버튼으로 이동하고 발사하세요.</p>
        <button type="button" id="start-btn" class="primary-btn">시작하기</button>
        <p class="hint howto-keys">Enter 또는 Space로도 시작할 수 있어요</p>
      </div>

      <!-- 일시정지 화면 -->
      <div id="pause-screen" class="overlay" hidden>
        <h2>일시정지</h2>
        <button type="button" id="resume-btn" class="primary-btn">계속하기</button>
        <p class="hint howto-keys">P 또는 Esc로 계속</p>
      </div>

      <!-- 게임 종료 화면 -->
      <div id="gameover-screen" class="overlay" hidden>
        <h2>게임 종료</h2>
        <p class="final">최종 점수 <b id="final-score">0</b></p>
        <p id="new-best" class="new-best" hidden>🎉 최고 기록 달성!</p>
        <button type="button" id="restart-btn" class="primary-btn">다시 시작</button>
        <p class="hint howto-keys">Enter 또는 R로 다시 시작</p>
      </div>
    </div>

    <!-- 모바일 터치 조작 (터치 화면에서만 보임) -->
    <div id="touch-controls" aria-label="터치 조작">
      <div class="move-controls">
        <button type="button" data-key="ArrowLeft" aria-label="왼쪽 이동">◀</button>
        <button type="button" data-key="ArrowRight" aria-label="오른쪽 이동">▶</button>
      </div>
      <button type="button" id="fire" data-key="Space" aria-label="발사">발사</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
